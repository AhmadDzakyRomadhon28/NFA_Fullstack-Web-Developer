<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frameset Layout</title>
</head>
<frameset rows="15%, 5%, *, 5%">
    <frame src="banner.html" name="header" scrolling="no" noresize>
    <frame src="menu.html" name="menu" scrolling="no" noresize>
    <frameset cols="20%, 60%, 20%">
        <frame src="left.html" name="left">
        <frame src="about:blank" name="main">
        <frame src="right.html" name="right">
    </frameset>
    <frame src="footer.html" name="footer" scrolling="no" noresize>

</frameset>
</html>
