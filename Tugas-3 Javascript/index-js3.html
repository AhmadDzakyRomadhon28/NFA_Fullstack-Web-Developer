<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 3 - Manajemen Produk Toko</title>
</head>
<body>
    <h1>Tugas 3: Array & Function JavaScript</h1>
    <p>Silakan tekan <strong>F12</strong> (atau Klik Kanan -> Inspect) lalu buka tab <strong>Console</strong> untuk melihat jalannya program.</p>

    <!-- Script Internal JavaScript -->
    <script>
        // 1. Array objek untuk menyimpan daftar produk awal
        let produkToko = [
            { id: 1, nama: "Laptop", harga: 7000000, stok: 5 },
            { id: 2, nama: "Mouse", harga: 200000, stok: 10 },
            { id: 3, nama: "Keyboard", harga: 350000, stok: 7 }
        ];

        // 2. Fungsi tambah produk baru
        function tambahProduk(nama, harga, stok) {
            let idBaru = produkToko.length > 0 ? produkToko[produkToko.length - 1].id + 1 : 1;
            let produkBaru = {
                id: idBaru,
                nama: nama,
                harga: harga,
                stok: stok
            };
            produkToko.push(produkBaru);
            console.log(`[+] Produk "${nama}" berhasil ditambahkan.`);
        }

        // 3. Fungsi hapus produk berdasarkan ID
        function hapusProduk(id) {
            let index = produkToko.findIndex(produk => produk.id === id);
            if (index !== -1) {
                let namaHapus = produkToko[index].nama;
                produkToko.splice(index, 1);
                console.log(`[-] Produk "${namaHapus}" (ID: ${id}) berhasil dihapus.`);
            } else {
                console.log(`[!] Produk dengan ID ${id} tidak ditemukan.`);
            }
        }

        // 4. Fungsi tampilkan semua produk
        function tampilkanProduk() {
            console.log("\n=== DAFTAR PRODUK TOKO ===");
            if (produkToko.length === 0) {
                console.log("Tidak ada produk tersedia.");
                return;
            }
            produkToko.forEach(produk => {
                console.log(`ID: ${produk.id} | Nama: ${produk.nama} | Harga: Rp${produk.harga.toLocaleString()} | Stok: ${produk.stok}`);
            });
        }

        // ==========================================
        // PENGUJIAN PROGRAM
        // ==========================================
        tampilkanProduk();
        tambahProduk("Monitor", 1500000, 4);
        tampilkanProduk();
        hapusProduk(2);
        tampilkanProduk();
    </script>
</body>
</html>
